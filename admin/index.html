<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Cervejaria Rodada</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">
    <div class="logo">
      <h2>RODADA</h2>
      <span>ADMIN</span>
    </div>

    <nav>
      <a href="#" class="active">Dashboard</a>
      <a href="#">Produtos</a>
      <a href="#">Pedidos</a>
      <a href="#">Orçamentos</a>
      <a href="#">Leads</a>
      <a href="#">Conteúdo do site</a>
      <a href="#">Imagens</a>
      <a href="#">Configurações</a>
    </nav>
  </aside>

  <main class="content">

    <header>
      <div>
        <h1>Painel Administrativo</h1>
        <p>Cervejaria Rodada</p>
      </div>

      <button>Sair</button>
    </header>

    <section class="cards">

      <div class="card">
        <span>Pedidos</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Orçamentos</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Leads</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Produtos</span>
        <strong>0</strong>
      </div>

    </section>

    <section class="panel">
      <h2>Visão geral</h2>
      <p>Gerencie a Cervejaria Rodada através deste painel.</p>
    </section>

  </main>

</body>
</html>
